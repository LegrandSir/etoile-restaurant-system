server.port=${PORT:8080}

# Embedded H2 database (persisted to a local ./data folder inside the project)
spring.datasource.url=jdbc:h2:file:./data/etoiledb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate auto table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (handy for showing live tables during your presentation)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console